id: C-007
title: Integration, build result.txt from all parts (depends on C-006)
type: normal
supersedes: [C-005]
goal: |
  Create result.txt containing, in this order, the exact contents of hello.txt, parts/a.txt,
  parts/b.txt and parts/c.txt (four lines).
inputs: []
after:
  - C-001
  - C-002
  - C-003
  - C-006
provides:
  - result.txt
read:
  - hello.txt
  - parts/a.txt
  - parts/b.txt
  - parts/c.txt
allowed_paths:
  - result.txt
outputs:
  - result.txt
acceptance:
  - cmd: test -f result.txt
  - cmd: test "$(cat result.txt)" = "$(cat hello.txt parts/a.txt parts/b.txt parts/c.txt)"
notes: |
  Supersedes C-005, which waited on the superseded C-004. Now waits on C-006 (the fixed C-004).
